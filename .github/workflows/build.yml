name: Build VoodooI2C Kext

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest
    env:
      PROJECT_TYPE: KEXT
      JOB_TYPE: BUILD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 500

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: VoodooInput Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/VoodooInput/master/VoodooInput/Scripts/bootstrap.sh) && eval "$src" && mv VoodooInput Dependencies

      - name: Show workspace
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          xcodebuild -version

      - name: Build Release kexts
        run: |
          xcodebuild \
            -workspace VoodooI2C.xcworkspace \
            -scheme VoodooI2C \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${GITHUB_WORKSPACE}/build/Release" \
            build

      - name: Build Debug kexts
        run: |
          xcodebuild \
            -workspace VoodooI2C.xcworkspace \
            -scheme VoodooI2C \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${GITHUB_WORKSPACE}/build/Debug" \
            build

      - name: Verify build artifacts
        run: |
          echo "--- Release build ---"
          ls -la build/Release/
          file build/Release/VoodooI2C.kext/Contents/MacOS/VoodooI2C
          echo "--- Debug build ---"
          ls -la build/Debug/
          file build/Debug/VoodooI2C.kext/Contents/MacOS/VoodooI2C

      - name: Package kext bundles
        run: |
          mkdir -p artifacts
          cd build/Release
          zip -qry "${GITHUB_WORKSPACE}/artifacts/VoodooI2C-RELEASE.zip" *.kext
          cd ../Debug
          zip -qry "${GITHUB_WORKSPACE}/artifacts/VoodooI2C-DEBUG.zip" *.kext *.dSYM
          cd "${GITHUB_WORKSPACE}"
          ls -lh artifacts/

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoodooI2C-RELEASE-${{ github.sha }}
          path: artifacts/VoodooI2C-RELEASE.zip
          retention-days: 30

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoodooI2C-DEBUG-${{ github.sha }}
          path: artifacts/VoodooI2C-DEBUG.zip
          retention-days: 30

  release:
    name: Publish Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        run: |
          mkdir -p release_assets
          find dist -type f -name "*.zip" -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
